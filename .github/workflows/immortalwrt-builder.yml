name: ImmortalWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: "SSH connection to Actions"
        required: false
        default: "false"
      cache:
        description: "Cache wrt build"
        required: false
        default: "true"

env:
  # 构建流程对仓库/分支/feeds/.config/依赖清单的约定已收敛到 scripts/build/，
  # CI 只保留仍需外部传入的两项（未设置时脚本会回落到同名默认值）。
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  GEN_INDEX_SH: scripts/ci/generate-index.sh
  UPLOAD_BIN_DIR: true
  DEPLOY_TO_PAGES: true
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    # 22.04 已进入维护尾声，24.04 的 apt 源里有 clang-18 全套（scripts/build/dependencies.txt 依赖）。
    # 刻意不用 ubuntu-latest：避免上游切换镜像时构建环境无声漂移。
    runs-on: ubuntu-24.04
    outputs:
      device_name: ${{ steps.compile.outputs.device_name }}
      file_date: ${{ steps.compile.outputs.file_date }}

    steps:
      - name: Check Server Performance
        id: hw
        run: |
          echo "警告⚠"
          echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo -e "已知CPU型号(降序): 7763，8370C，8272CL，8171M，E5-2673\n"
          echo "--------------------------CPU信息--------------------------"
          echo "CPU物理数量: $(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo "CPU核心数量: $(nproc)"
          echo -e "CPU型号信息:$(cat /proc/cpuinfo | grep -m1 name | awk -F: '{print $2}')\n"
          echo "--------------------------内存信息--------------------------"
          echo "已安装内存详细信息:"
          echo -e "$(sudo lshw -short -C memory | grep GiB)\n"
          echo "--------------------------硬盘信息--------------------------"
          echo "硬盘数量: $(find /dev -maxdepth 1 -name 'sd*' | grep -vc '[0-9]$')" && df -hT

      - name: "Optimize Disk Space"
        id: disk
        uses: "hugoalh/disk-space-optimizer-ghaction@v0.8.1"
        with:
          operate_sudo: "True"
          general_include: ".+"
          general_exclude: |-
            ^GCC$
            ^G\+\+$
            Clang
            LLVM
          docker_include: ".+"
          docker_prune: "True"
          docker_clean: "True"
          apt_prune: "True"
          apt_clean: "True"
          homebrew_prune: "True"
          homebrew_clean: "True"
          npm_prune: "True"
          npm_clean: "True"
          os_swap: "True"

      - name: Free up disk space complete
        id: diskdone
        run: |
          echo "Free up disk space complete"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      # 密钥体系门禁必须排在 checkout 之后的最前面：脚本存放在仓库里，checkout 之前拿不到；
      # 而密钥不对（缺失或与镜像内公钥不同源）时，越早红掉越省事——后面每一步都要花掉大量
      # runner 时间，等到打包/发布阶段才发现，等于白跑一次完整编译。
      # REQUIRED=1 是 CI 的唯一合法值：缺 Secret/Variable 时必须硬失败，不允许静默降级成告警。
      - name: Verify apk signing key
        id: apk_key
        env:
          REQUIRED: "1"
          APK_PUBLIC_KEY_SHA256: ${{ vars.APK_PUBLIC_KEY_SHA256 }}
        run: bash scripts/ci/check-apk-signing-key.sh env

      # 只保留 CI 独占的部分：清理 runner 预装的重型运行时与第三方源、设置 runner 时区、修正工作区属主。
      # 依赖安装已收敛到 scripts/build/build.sh deps（唯一会调用 apt 的阶段）；
      # purge 里含 llvm*，脚本会重新装回 clang-18 全套，二者逻辑自洽。
      - name: Initialization environment
        id: env_setup
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y purge azure-cli* docker* ghc* zulu* hhvm* llvm* firefox* google* dotnet* aspnetcore* powershell* openjdk* adoptopenjdk* mysql* php* mongodb* moby* snap* || true
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          # 清理 runner 预装的第三方源（azure / claude / ppa 等），但【必须保留 Ubuntu 自身的源】。
          # 不能沿用上游 P3TERX 的 rm -rf /etc/apt/sources.list.d/*：那是 22.04 时代的写法（主源在
          # /etc/apt/sources.list）。24.04 起 apt 改用 deb822，主源挪进了 sources.list.d/ubuntu.sources，
          # 而 sources.list 只剩注释，整目录删空后 apt-get update 会「成功」地空转（不报错！），
          # 随后 install 的每个包都变成 Unable to locate package / has no installation candidate。
          # 因此按内容判断：含 ubuntu.com / ports.ubuntu 的源文件一律保留，其余删除。
          while IFS= read -r src; do
            grep -qiE 'ubuntu\.com|ports\.ubuntu' "$src" || sudo rm -f "$src"
          done < <(find /etc/apt/sources.list.d -maxdepth 1 -type f 2>/dev/null)
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/graalvm /usr/local/.ghcup \
          /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
          # 源目录被清空时 apt 不报错、只让后续安装集体失败，所以在这里一次性断言：
          # 宁可这一步红，也不要让 deps 阶段拿 85 条 Unable to locate 去误导排查。
          # 判据只能是「文件里还写着 ubuntu 源」：apt-get indextargets 依赖已下载的索引，
          # 而本步骤跑在 apt-get update 之前，那时它恒为空，用它断言会把正常状态误判成断源。
          if ! grep -qiE 'ubuntu\.com|ports\.ubuntu' /etc/apt/sources.list.d/* 2>/dev/null; then
            echo "::error::No Ubuntu apt source left in /etc/apt/sources.list.d; check the source pruning above."
            exit 1
          fi
          sudo timedatectl set-timezone "$TZ"
          sudo chown "$USER:${GROUPS[0]}" "$GITHUB_WORKSPACE"

      # 安装主机编译依赖（scripts/build/dependencies.txt）+ upx/padjffs2/po2lmo。
      # REQUIRED=1：缺依赖清单或装依赖失败必须让流水线红，不得降级为警告。
      - name: Install build dependencies
        id: deps
        env:
          DEBIAN_FRONTEND: noninteractive
          REQUIRED: "1"
        run: bash scripts/build/build.sh deps

      # 克隆 + 私钥 + feeds + 自定义文件 + .config + DIY1/feeds update -a/DIY2/update -i/install -a + defconfig
      # 全部收敛到 prepare。CI 侧必须保留 secret 缺失即失败的语义：
      # scripts/build/pipeline.sh 的 restore_apk_signing_key（第 134 行起）在 REQUIRED=1 时若既无
      # APK_PRIVATE_KEY_B64 也无 keys/private-key.pem（CI 中该文件不存在，已 gitignore）会硬失败。
      # 该函数还会用私钥派生公钥，再调用 scripts/ci/check-apk-signing-key.sh key 比对指纹；
      # 因此【凡是会跑到私钥还原的步骤都必须传入 APK_PUBLIC_KEY_SHA256】：本步骤与 'Build firmware'
      # 都要传，漏传则门禁在严格模式下拿不到比对基准而中断，私钥还原成功反而让流水线立刻变红。
      # 该 Variable 与 job 最前面的 apk_key 门禁共用同一个 APK_PUBLIC_KEY_SHA256，不要另设第二份基准。
      #
      # 注意：后面的 'Build firmware' 跑 bash scripts/build/build.sh compile，而 compile 阶段内含 prepare。
      # 因此 prepare 被实现了幂等（scripts/build/pipeline.sh 的 prepare_all 用输入指纹判断）：
      # 这里准备的输入在第二步不变，第二次 prepare 是空操作，不会重复 clone/feeds/defconfig，
      # 也不会因为重新执行 copy_custom_files 而删掉本步骤之后生成的 99-release-info。
      - name: Prepare build workspace
        id: prepare
        env:
          REQUIRED: "1"
          APK_PRIVATE_KEY_B64: ${{ secrets.APK_PRIVATE_KEY_B64 }}
          # 门禁脚本的比对基准；缺失时严格模式直接中断，私钥还原也就无从完成。
          APK_PUBLIC_KEY_SHA256: ${{ vars.APK_PUBLIC_KEY_SHA256 }}
        run: bash scripts/build/build.sh prepare

      # 编译缓存：ccache 与 staging_dir 分开缓存。
      #
      # 为什么弃用 klever1988/cachewrtbuild（原实现）：
      #   它的 key 形如 cache-openwrt-<tools/toolchain 的 commit hash>-<时间戳>，
      #   恢复时只用「不含时间戳但含 hash」的前缀做 restoreKeys。上游 tools/ 目录
      #   近期连续多日有提交（10-24/25/26 均有），hash 一变前缀就不匹配，
      #   上一份缓存整体恢复不到。实测 #40488625820 的 cache 步骤 0 秒完成——
      #   它只是「找了一圈没找到」。该 action 也没有任何 tag，无法钉版本。
      #
      # 为什么分成两份：
      #   .ccache 与 staging_dir 的变化频率完全不同。ccache 是**内容寻址**的，
      #   源文件没变就能命中，与 key 是否精确匹配无关，因此用 restore-keys 前缀
      #   回退是安全的；staging_dir 里的工具链与库则与源码版本强相关，跨版本复用
      #   会产出难查的编译错误，所以它的 key 故意带上源码相关指纹，宁可不命中。
      #
      # 为什么 ccache 用 restore 而不复用同一份 key：
      #   GitHub Actions 的缓存不可变，同一 key 一旦写入就不再覆盖。ccache 是持续
      #   增长的，必须每次用新 key（含 run 序号）保存，靠 restore-keys 前缀回退
      #   取最近一份，才能让缓存随构建不断累积。
      #
      # 位置要求：必须在 prepare 之后（.ccache 与 staging_dir 在 prepare 时才成型）、
      # 下载与编译之前。
      - name: Restore ccache
        id: ccache_restore
        if: github.event.inputs.cache != 'false'
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/immortalwrt/.ccache
          # run_id 让每次都是新 key；前缀回退保证总能拿到最近一份。
          key: ccache-bpi-r4-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-bpi-r4-

      - name: Restore staging dir
        id: staging_restore
        if: github.event.inputs.cache != 'false'
        uses: actions/cache/restore@v6
        with:
          # 只缓存可复用的构建中间态。刻意排除 root-mediatek（912M，是安装到固件根的
          # 暂存区，可由 staging 里的包重建），避免缓存体积无谓膨胀。
          path: |
            ${{ github.workspace }}/immortalwrt/staging_dir/host
            ${{ github.workspace }}/immortalwrt/staging_dir/hostpkg
            ${{ github.workspace }}/immortalwrt/staging_dir/toolchain-*
            ${{ github.workspace }}/immortalwrt/staging_dir/target-*/usr
            ${{ github.workspace }}/immortalwrt/staging_dir/target-*/stamp
          # 这份 key 带源码相关指纹：staging 跨版本复用不安全，变化时宁可重建。
          # 用 .config 与 dependencies.txt 的哈希，二者直接决定工具链与包的选型。
          key: staging-bpi-r4-${{ hashFiles('immortalwrt/.config', 'scripts/build/dependencies.txt') }}
          restore-keys: |
            staging-bpi-r4-

      # 生成 immortalwrt/files/etc/uci-defaults/99-release-info，并把 RELEASE_TAG 写入 $GITHUB_ENV。
      # 与旧内联块一样依赖 runner 预置的 GITHUB_REPOSITORY / GITHUB_ACTOR。
      # 不需要把结果镜像回仓库根 files/：随后 'Build firmware' 内部的第二次 prepare 因幂等而空操作，
      # copy_custom_files 不会再执行，生成的文件能留到 make 打进镜像。
      - name: ImmortalWrt AutoUpdate
        id: release_info
        run: bash scripts/ci/generate-release-info.sh

      - name: SSH connection to Actions
        id: ssh
        uses: P3TERX/ssh2actions@v1.0.0
        if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      # 编译（download + make 三段式重试均在脚本内）。id 必须叫 compile：
      # 下面的步骤条件与 job outputs（device_name / file_date）都按这个名字引用。
      - name: Build firmware
        id: compile
        env:
          REQUIRED: "1"
          # compile 阶段内部会再跑一次 prepare（含私钥还原），这里必须同样提供 secret，
          # 否则严格模式下第二次私钥还原会因找不到密钥而硬失败。
          APK_PRIVATE_KEY_B64: ${{ secrets.APK_PRIVATE_KEY_B64 }}
          # 同理：第二次私钥还原也会走门禁脚本比对指纹，基准必须与 prepare / apk_key 保持一致。
          APK_PUBLIC_KEY_SHA256: ${{ vars.APK_PUBLIC_KEY_SHA256 }}
        run: |
          bash scripts/build/build.sh compile
          echo "status=success" >> "$GITHUB_OUTPUT"
          grep '^CONFIG_TARGET.*DEVICE.*=y' immortalwrt/.config | sed -r 's/.*DEVICE_(.*)=y/\1/' > immortalwrt/DEVICE_NAME
          [ -s immortalwrt/DEVICE_NAME ] && {
            device_name="_$(cat immortalwrt/DEVICE_NAME)"
            echo "DEVICE_NAME=${device_name}" >> "$GITHUB_ENV"
            echo "DEVICE_NAME=${device_name}" >> "$GITHUB_OUTPUT"
          }
          file_date="_$(date +"%Y%m%d%H%M")"
          echo "FILE_DATE=${file_date}" >> "$GITHUB_ENV"
          echo "file_date=${file_date}" >> "$GITHUB_OUTPUT"

      # 体积报告只是诊断信息：脚本自身不改动工作区，且失败时不能让已编好的产物丢失，
      # 故 continue-on-error，同时把编译成功与否一起作为执行条件。
      - name: Report firmware size
        id: size
        if: steps.compile.outputs.status == 'success' && !cancelled()
        continue-on-error: true
        run: bash scripts/build/build.sh check

      - name: Check space usage
        id: space
        if: (!cancelled())
        run: df -hT

      # 构建脚本的完整日志（scripts/libs/01-shell-logger.sh 默认落到仓库根 logs/）。
      # 放在编译之后：失败时也要拿到日志，故条件用 always() + !cancelled()。
      - name: Upload build logs
        id: artifact_logs
        uses: actions/upload-artifact@v7
        if: always() && !cancelled()
        with:
          name: ImmortalWrt_logs${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: logs/
          if-no-files-found: warn
          retention-days: 7

      # 公钥不再入库（keys/public-key.pem 已删除），改由编译期产物派生并直接落到发布树：
      # 上游 package/Makefile 在编译时用私钥生成 immortalwrt/public-key.pem
      # （rules.mk 的 BUILD_KEY_APK_PUB），它只留在编译目录里，不放进 bin/ 就不会被发布。
      # 必须排在 'Upload bin directory' 之前，否则上传的 bin 包里没有公钥。
      # 源文件缺失即硬失败：公钥是该步骤唯一目的，静默跳过会让 /keys/public-key.pem 404。
      # 只发 /keys/public-key.pem 一处：历史上还在站点根目录放过一份同名副本供"旧导入链接"使用，
      # 但旧的导入命令一直指向 pkgs.lssa.fun 的另一个路径，从未指向本站根目录，那份副本没有
      # 真实调用方，已删除——页面上不再出现两个同名文件，也不再需要维护两份同源的信任锚。
      - name: Publish apk public key into bin
        id: apk_pubkey
        run: |
          if [ ! -s immortalwrt/public-key.pem ]; then
            echo "::error::immortalwrt/public-key.pem is missing or empty; the compile stage did not derive the apk public key from the private key (BUILD_KEY_APK_PUB in rules.mk)."
            exit 1
          fi
          mkdir -p immortalwrt/bin/keys
          cp immortalwrt/public-key.pem immortalwrt/bin/keys/public-key.pem

      - name: Upload bin directory
        id: artifact_bin
        uses: actions/upload-artifact@v7
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true' && !cancelled()
        with:
          name: ImmortalWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: immortalwrt/bin

      - name: Get environment path
        id: environment
        if: env.UPLOAD_BIN_DIR == 'true' && !cancelled()
        run: |
          cd immortalwrt/bin/
          echo "WORKSPACE_DIR=$PWD" >> "$GITHUB_ENV"
          cd  targets/*/*
          echo "UPLOAD_PATH=$PWD" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Compressed kernel packages
        id: zip_kernel
        uses: thedoctor0/zip-release@0.7.6
        if: steps.environment.outputs.status == 'success' && steps.compile.outputs.status == 'success' && !cancelled()
        with:
          type: tar
          path: packages/
          directory: ${{ env.UPLOAD_PATH }}/
          filename: ${{ env.UPLOAD_PATH }}/ImmortalWrt_firmware_kernel_packages${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}.tar.gz

      - name: Compressed firmware packages
        id: zip_packages
        uses: thedoctor0/zip-release@0.7.6
        if: steps.environment.outputs.status == 'success' && steps.compile.outputs.status == 'success' && !cancelled()
        with:
          type: tar
          path: packages/
          directory: ${{ env.WORKSPACE_DIR }}/
          filename: ${{ env.UPLOAD_PATH }}/ImmortalWrt_firmware_packages${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}.tar.gz

      # 删除 packages/ 只为了不把已解包的 .apk 目录塞进 firmware artifact 与 release
      # （两个 .tar.gz 已在上面两条 zip 步骤里打包过，内容不缺）。
      # 但这目录里的 index.json 是「target 专属包已产出」的唯一证据，而 Run summary 排在本步骤之后
      # —— 先删后统计，会让 154 个 kmod / target 包全部被判成「未产出」（实测 153 条误报）。
      # 因此删除前把这份索引快照到 $RUNNER_TEMP，由 TARGET_PACKAGE_INDEX_FILE 传给摘要脚本。
      # 快照与删除同条件：目录只在 UPLOAD_FIRMWARE=true 时会被删，此时才需要这份副本。
      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd immortalwrt/bin/targets/*/*
          if [ -f packages/index.json ]; then
            cp packages/index.json "$RUNNER_TEMP/target-packages-index.json"
            echo "TARGET_PACKAGE_INDEX_FILE=$RUNNER_TEMP/target-packages-index.json" >> "$GITHUB_ENV"
          fi
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware directory
        id: artifact_firmware
        uses: actions/upload-artifact@v7
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: ImmortalWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Upload firmware to cowtransfer
        id: cowtransfer
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
        run: |
          curl -fsSL git.io/file-transfer | sh
          ./transfer cow --block 2621440 -s -p 64 --no-progress "${FIRMWARE}" 2>&1 | tee cowtransfer.log
          echo "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
          echo "url=$(cat cowtransfer.log | grep https | cut -f3 -d" ")" >> "$GITHUB_OUTPUT"

      - name: Upload firmware to WeTransfer
        id: wetransfer
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
        run: |
          curl -fsSL git.io/file-transfer | sh
          ./transfer wet -s -p 16 --no-progress "${FIRMWARE}" 2>&1 | tee wetransfer.log
          echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"
          echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> "$GITHUB_OUTPUT"

      # release.txt 由脚本生成（读 COWTRANSFER_URL / WETRANSFER_URL），仍以环境变量传上游 step 的输出。
      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
        env:
          COWTRANSFER_URL: ${{ steps.cowtransfer.outputs.url }}
          WETRANSFER_URL: ${{ steps.wetransfer.outputs.url }}
        run: |
          bash scripts/ci/generate-release-notes.sh
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware to release
        id: release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release.txt
          files: |
            ${{ env.FIRMWARE }}/*

      - name: Delete workflow runs
        id: cleanup_runs
        uses: GitRML/delete-workflow-runs@v1.2
        with:
          retain_days: 7
          keep_minimum_runs: 7

      - name: Remove old Releases
        id: cleanup_releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 7
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 保存缓存：放在收尾步骤里，编译成功与否都执行（if: always()）。
      #
      # 为什么用 always() 而不是 success()：
      #   ccache 的价值恰恰在失败时更大——失败重试若从空缓存开始，等于每次都全量重编。
      #   失败时已编译成功的部分同样值得留下。
      # 为什么不用 actions/cache@v6 的自动保存（post 钩子）：
      #   自动保存只在 job success 时触发，且一个 job 里多个 restore 会让自动保存无法
      #   区分该存哪一份。显式 save 让「存什么、什么时候存」都写在明面上。
      # 为什么 key 与 restore 用同一个含 run_id 的值：
      #   GitHub Actions 缓存不可变（同名不覆盖），每次运行必须换新 key 才能让 ccache
      #   持续累积；restore-keys 前缀回退负责取最近一份。
      # 目录存在才保存：prepare 之前就失败时 .ccache 还没生成，
      # 强行 save 只会得到一条「Path Validation Error / no files」的噪音告警。
      # output 名刻意用简单键（ccache / staging），不用路径本身：
      # 含 / 与 . 的名字在 steps.<id>.outputs[...] 里引用时行为不明确，容易踩坑。
      - name: Check cache paths
        id: cache_paths
        if: always()
        run: |
          if [ -d immortalwrt/.ccache ]; then
            echo "ccache=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ccache=no" >> "$GITHUB_OUTPUT"
          fi
          if [ -d immortalwrt/staging_dir ]; then
            echo "staging=yes" >> "$GITHUB_OUTPUT"
          else
            echo "staging=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Save ccache
        id: ccache_save
        if: always() && github.event.inputs.cache != 'false' && steps.cache_paths.outputs.ccache == 'yes'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/immortalwrt/.ccache
          key: ccache-bpi-r4-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save staging dir
        id: staging_save
        if: always() && github.event.inputs.cache != 'false' && steps.cache_paths.outputs.staging == 'yes'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ github.workspace }}/immortalwrt/staging_dir/host
            ${{ github.workspace }}/immortalwrt/staging_dir/hostpkg
            ${{ github.workspace }}/immortalwrt/staging_dir/toolchain-*
            ${{ github.workspace }}/immortalwrt/staging_dir/target-*/usr
            ${{ github.workspace }}/immortalwrt/staging_dir/target-*/stamp
          key: staging-bpi-r4-${{ hashFiles('immortalwrt/.config', 'scripts/build/dependencies.txt') }}

      # 运行总结：把各步骤 outcome 汇总成一段 Markdown 写进 job summary。
      # if: always() —— 失败/取消时同样要出总结，这正是排障最需要的时刻。
      # continue-on-error + 脚本恒 0 退出码双保险：摘要绝不能让已经红了或被取消的流水线变得更糟。
      # 步骤 outcome 只能通过 steps.<id>.outcome 取（.conclusion 需要前置 job 才能拿到等价信息），
      # 因此上面每个步骤都补了 id；STEP_SEQUENCE 的顺序必须与 steps 顺序一致，脚本按它渲染表格。
      - name: Run summary
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          # 多行块：每行 "KEY|显示名称"，顺序 = 步骤在 job 中的顺序。
          STEP_SEQUENCE: |
            hw|Check Server Performance
            disk|Optimize Disk Space
            diskdone|Free up disk space complete
            checkout|Checkout
            apk_key|Verify apk signing key
            env_setup|Initialization environment
            deps|Install build dependencies
            prepare|Prepare build workspace
            ccache_restore|Restore ccache
            staging_restore|Restore staging dir
            release_info|ImmortalWrt AutoUpdate
            ssh|SSH connection to Actions
            compile|Build firmware
            size|Report firmware size
            space|Check space usage
            artifact_logs|Upload build logs
            apk_pubkey|Publish apk public key into bin
            artifact_bin|Upload bin directory
            environment|Get environment path
            zip_kernel|Compressed kernel packages
            zip_packages|Compressed firmware packages
            organize|Organize files
            artifact_firmware|Upload firmware directory
            cowtransfer|Upload firmware to cowtransfer
            wetransfer|Upload firmware to WeTransfer
            tag|Generate release tag
            release|Upload firmware to release
            cleanup_runs|Delete workflow runs
            cleanup_releases|Remove old Releases
          STEP_hw: ${{ steps.hw.outcome }}
          STEP_disk: ${{ steps.disk.outcome }}
          STEP_diskdone: ${{ steps.diskdone.outcome }}
          STEP_checkout: ${{ steps.checkout.outcome }}
          STEP_apk_key: ${{ steps.apk_key.outcome }}
          STEP_env_setup: ${{ steps.env_setup.outcome }}
          STEP_deps: ${{ steps.deps.outcome }}
          STEP_prepare: ${{ steps.prepare.outcome }}
          STEP_ccache_restore: ${{ steps.ccache_restore.outcome }}
          STEP_staging_restore: ${{ steps.staging_restore.outcome }}
          STEP_release_info: ${{ steps.release_info.outcome }}
          STEP_ssh: ${{ steps.ssh.outcome }}
          STEP_compile: ${{ steps.compile.outcome }}
          STEP_size: ${{ steps.size.outcome }}
          STEP_space: ${{ steps.space.outcome }}
          STEP_artifact_logs: ${{ steps.artifact_logs.outcome }}
          STEP_apk_pubkey: ${{ steps.apk_pubkey.outcome }}
          STEP_artifact_bin: ${{ steps.artifact_bin.outcome }}
          STEP_environment: ${{ steps.environment.outcome }}
          STEP_zip_kernel: ${{ steps.zip_kernel.outcome }}
          STEP_zip_packages: ${{ steps.zip_packages.outcome }}
          STEP_organize: ${{ steps.organize.outcome }}
          STEP_artifact_firmware: ${{ steps.artifact_firmware.outcome }}
          STEP_cowtransfer: ${{ steps.cowtransfer.outcome }}
          STEP_wetransfer: ${{ steps.wetransfer.outcome }}
          STEP_tag: ${{ steps.tag.outcome }}
          STEP_release: ${{ steps.release.outcome }}
          STEP_cleanup_runs: ${{ steps.cleanup_runs.outcome }}
          STEP_cleanup_releases: ${{ steps.cleanup_releases.outcome }}
          DEVICE_NAME: ${{ env.DEVICE_NAME }}
          FILE_DATE: ${{ env.FILE_DATE }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          # artifact 名必须与对应 upload-artifact 的 name 逐字一致，含表达式时原样照抄，
          # 否则摘要里给出的 artifact 名与实际可下载的名字对不上。
          ARTIFACT_BIN_NAME: ImmortalWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          ARTIFACT_FIRMWARE_NAME: ImmortalWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          ARTIFACT_LOGS_NAME: ImmortalWrt_logs${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          # 空字符串也是合法值，脚本按"缺失即跳过"处理。
          # restore 动作的 cache-hit 只在**精确**命中时为 true；前缀回退（restore-keys）
          # 命中时它是 false 但 cache-matched-key 有值。这里两种都算命中——
          # 我们的 key 特意带 run_id 让它永不精确命中，只看精确值会永远显示"未命中"。
          CACHE_HIT: ${{ (steps.ccache_restore.outputs.cache-hit == 'true' || steps.ccache_restore.outputs.cache-matched-key != '') && (steps.staging_restore.outputs.cache-hit == 'true' || steps.staging_restore.outputs.cache-matched-key != '') && 'true' || 'false' }}
          LOG_DIR: logs
          # target 专属包的索引由 organize 步骤在 rm -rf packages 之前快照到 RUNNER_TEMP，
          # 这里把路径递给脚本当补充数据源：目录本身已不在，光靠 glob 读不到它。
          # 该步骤被跳过（UPLOAD_FIRMWARE=false）时这里是空串——那时目录仍在，脚本回退到 glob。
          TARGET_PACKAGE_INDEX_FILE: ${{ env.TARGET_PACKAGE_INDEX_FILE }}
        run: bash scripts/ci/generate-summary.sh build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      DEVICE_NAME: ${{ needs.build.outputs.device_name }}
      FILE_DATE: ${{ needs.build.outputs.file_date }}

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        if: env.UPLOAD_BIN_DIR == 'true' && env.DEPLOY_TO_PAGES == 'true'
        uses: actions/checkout@v7

      - name: Download artifact
        if: env.UPLOAD_BIN_DIR == 'true' && env.DEPLOY_TO_PAGES == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ImmortalWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: bin

      # 公钥不再入库，deploy 侧无从拷贝，只做校验：文件由 build job 的 apk_pubkey 步骤生成
      # 并随 bin artifact 一起下载到 bin/，缺失或为空说明那一步没生效，直接硬失败，
      # 避免把缺公钥的站点发布出去。
      # 必须排在 'Generate index.html' 之前：索引按目录树静态渲染，公钥晚到就不会出现在 keys/ 条目里。
      # 只校验正式路径 /keys/public-key.pem；站点根目录的同名副本已删除（见 build job 的 apk_pubkey 注释）。
      - name: Verify apk public key in bin
        if: env.UPLOAD_BIN_DIR == 'true' && env.DEPLOY_TO_PAGES == 'true'
        run: |
          if [ ! -s bin/keys/public-key.pem ]; then
            echo "::error::bin/keys/public-key.pem is missing or empty; the build job's apk_pubkey step did not publish the apk public key."
            exit 1
          fi

      - name: Generate index.html
        if: env.UPLOAD_BIN_DIR == 'true' && env.DEPLOY_TO_PAGES == 'true'
        run: |
          chmod +x "$GEN_INDEX_SH"
          bash "$GEN_INDEX_SH"

      - name: Upload pages artifact
        if: env.UPLOAD_BIN_DIR == 'true' && env.DEPLOY_TO_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: bin

      - name: Deploy to GitHub Pages
        if: env.UPLOAD_BIN_DIR == 'true' && env.DEPLOY_TO_PAGES == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
