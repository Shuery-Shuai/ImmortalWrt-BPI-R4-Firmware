# Dependabot 自动合并（dependabot-merger）：只对 minor / patch 升级武装 auto-merge。
#
# 为什么需要这个文件：Dependabot 自身【没有】自动合并的配置项（dependabot-options 参考里查不到），
# 官方做法是仓库开 auto-merge + 分支保护配必需检查 + 由 workflow 调 gh pr merge --auto。
# 三者缺一不可：少了分支保护，--auto 会在检查还没跑完时立刻合掉，等于没有门禁。
#
# 为什么只放行 minor / patch：major 跳跃常有破坏性变更（例如 Pages 部署里
# upload-pages-artifact 与 download-artifact 需要配套改），必须人工过目。
# 判定依据是 PR 标题里 Dependabot 自带的 from X to Y 与版本号分段，不依赖第三方 action。
#
# 为什么 0.x 只放行 patch：semver 里 0.y.z 是「初始开发阶段，任何版本都可能随时破坏兼容」，
# 所以 0.1.0 -> 0.3.4 这种 minor 位跳跃在处理 0.x 时必须按 major 对待。
# 本仓库正好有实例：dev-drprasad/delete-older-releases 0.1.0 -> 0.3.4 是「删旧 Release 与 tag」
# 的破坏性动作（delete_tags: true），自动合进来自动删错东西的代价远高于手动点一下。
name: Dependabot Merger

on:
  pull_request:

# Dependabot 触发的 workflow 默认拿只读 GITHUB_TOKEN（官方文档：treated as if opened from
# a repository fork），必须在这里显式提权，否则 gh pr merge 会因权限不足失败。
# 只提 PR 写权限：合并动作不需要 contents: write。
permissions:
  contents: read
  pull-requests: write

jobs:
  merger:
    name: merger
    runs-on: ubuntu-24.04
    # 处理两类机器人 PR：
    #   · dependabot[bot]       —— GitHub 原生依赖升级，标题形如 Bump X from A to B；
    #   · app/github-actions    —— 本仓库 dependency-auditor 自建的升级，标题形如
    #                              升级 X 到 V（中文），且自带 skip-compile 标签。
    # 后者是刻意纳入的：它由本仓库脚本主动探测上游版本后创建，写入前已核对版本清单与
    # 校验值，可靠性不低于 Dependabot；而它此前只能人工合并，让依赖升级长期停在待办里。
    # 人类 PR 一律不进本 job。
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'app/github-actions'
    steps:
      - name: Decide whether this update is minor or patch
        id: decide
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # 两种机器人标题格式都要能解析：
          #   Dependabot：        Bump actions/checkout from 4 to 7
          #                       Bump foo from 0.1.0 to 0.3.4 in the github-actions group
          #   dependency-auditor：🐳 chore(deps): 升级 dae 到 2.1.3
          # 两类标题的判定方式不同，理由见各自分支里的注释：
          #   · Dependabot 给出 from/to，按语义化版本分段比大小；
          #   · dependency-auditor 只给新版本，信任它的审计结论直接放行。
          # 两类的共同底线：标题解析不出来就按 major 处理（不动），绝不猜。
          from=""
          to=""
          if [[ "${TITLE}" =~ from\ ([0-9][^\ ]*)\ to\ ([0-9][^\ ]*) ]]; then
            from="${BASH_REMATCH[1]}"
            to="${BASH_REMATCH[2]}"
          elif [[ "${TITLE}" =~ 升级\ [^\ ]+\ 到\ ([0-9][^\ ]*) ]]; then
            # dependency-auditor 的格式：只有新版本号，没有旧版本。
            # 这里【不】去仓库读旧版本再比大小 —— 那等于把 auditor 已经做过的判断重做一遍，
            # 而且两处判断迟早会有分歧。auditor 在写 PR 之前已经探测上游版本、核对清单与
            # 校验值，只有它认为该升级时才会开 PR；本 job 尊重这个结论。
            # 真正的把关仍在分支保护上：四个必需检查全绿才会合入。
            to="${BASH_REMATCH[1]}"
            echo "dependency-auditor 升级：新版本=${to}，信任其审计结论"
            echo "eligible=true" >>"$GITHUB_OUTPUT"
            exit 0
          else
            echo "标题里找不到可解析的版本号，按 major 处理（不自动合并）"
            echo "eligible=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # 走到这里的只剩 Dependabot 的 from/to 格式，两个版本号都齐。
          echo "from=${from} to=${to}"
          IFS=. read -r -a a <<<"${from}"
          IFS=. read -r -a b <<<"${to}"
          width=${#a[@]}
          [[ ${#b[@]} -gt ${width} ]] && width=${#b[@]}
          eligible=false
          # 0.x 的 minor 位等同于 major（semver 明确 0.y.z 不保证兼容），因此单独抬高门槛。
          zero_major=false
          ((10#${a[0]:-0} == 0)) && zero_major=true
          for ((i = 0; i < width; i++)); do
            x="${a[i]:-0}"
            y="${b[i]:-0}"
            if ((10#${x} != 10#${y})); then
              if ((i == 0)); then
                echo "第一位数字不同 -> major，不自动合并"
              elif [[ "${zero_major}" == "true" && ${i} -lt 2 ]]; then
                echo "0.x 的 minor 位跳跃 -> 按 major 处理，不自动合并"
              else
                echo "第一位不同在 minor/patch 段 -> 允许自动合并"
                eligible=true
              fi
              break
            fi
          done
          echo "eligible=${eligible}"
          echo "eligible=${eligible}" >>"$GITHUB_OUTPUT"

      - name: Enable auto-merge for minor / patch updates
        if: steps.decide.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          # --auto 只是"武装"：真正合并要等分支保护里的四个必需检查通过
          # （pr-guard + shellcheck / actionlint / markdownlint）。dependabot 的 PR 不产固件，
          # pr-guard 对它豁免 C3/C6/C8（见门禁的「编译证据豁免」），只保留 C1/C2/C4/C5/C7。
          # --squash 让历史保持一条 PR 一条提交，与本仓库既有的整提交风格一致。
          gh pr merge --auto --squash "${PR_URL}"

      - name: Report why it was not auto-merged
        if: steps.decide.outputs.eligible != 'true'
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "未武装 auto-merge（判为 major / 0.x minor / 无法解析版本）：${TITLE}"