# sshd_config defaults on OpenWrt
# ============================================
# OpenWrt sshd_config 注意事项
# ============================================
# OpenWrt 首次安装默认：
#   - 只有一个 root 用户
#   - root 默认没有密码
# 因此下面几个默认选项非常危险，推荐系统安装完成后立即修改再重启 SSH。

# 1. 允许 root 登录
# 风险：直接暴露最高权限账户，容易被爆破。
# 建议：至少改为 prohibit-password，只允许密钥登录。
PermitRootLogin yes

# 2. 允许公钥认证
# 安全：建议保持 yes，优先使用密钥登录。
PubkeyAuthentication yes

# 3. 允许密码认证
# 风险：如果密码弱，容易被暴力破解。
# 建议：配置好公钥后，可改为 no 关闭密码登录。
PasswordAuthentication yes

# 4. 允许空密码登录
# 极度危险：OpenWrt 初始 root 没有密码，此选项会允许任何人直接登录！
# 强烈建议：在使用 passwd 给 root 设置密码后，立刻改为 no 禁用此选项！
PermitEmptyPasswords yes
