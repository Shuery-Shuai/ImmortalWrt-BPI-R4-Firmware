# OpenWrt sshd_config 默认项
# ============================================
# OpenWrt 首次安装时通常：
#   - 仅存在 root 用户
#   - root 默认未设置密码
# 因此，下列默认配置存在较高安全风险。建议在系统安装完成后尽快调整，并重启 SSH 服务。

# 1. 是否允许 root 登录
# 风险：直接暴露最高权限账户，容易被暴力破解。
# 建议：no，不允许 root 用户；若仅有 root 用户，推荐至少改为 prohibit-password，仅允许密钥登录。
# 注意：更改为 no 前，请保证已经添加了其他用户；
#       更改为 prohibit-password 前，请保证已在 .ssh/authorized_keys 中添加了公钥，且 ssh 连接通过。
PermitRootLogin yes

# 2. 是否允许公钥认证
# 建议：yes，并优先使用密钥登录。
PubkeyAuthentication yes

# 3. 是否允许密码认证
# 风险：若密码强度不足，容易被暴力破解。
# 建议：no，关闭密码登录。
# 注意：关闭前请保证 ssh 公钥能够正确连接至设备。
PasswordAuthentication yes

# 4. 是否允许空密码登录
# 极度危险：OpenWrt 初始 root 没有密码，开启此项会允许任何人直接登录！
# 强烈建议：no，不允许空密码。
# 务必注意：设定前请保证已经使用 passwd 命令设置了密码。
PermitEmptyPasswords yes