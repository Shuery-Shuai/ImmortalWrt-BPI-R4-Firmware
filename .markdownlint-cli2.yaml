# markdownlint 配置（YAML 格式：标准 JSON 不允许注释，YAML 天然支持）
#
# 用法：仓库根执行 `npx markdownlint-cli2 "README.md" "scripts/README.md"`，
#       cli2 会自动发现本文件（同目录或上层目录）。
#
# 只对确实无法满足或不适用的规则做调整，其余保持默认；每条调整都写明理由。
config:
  # MD013 行宽限制。
  # 正文按 120 列折行；表格 / 代码块 / 标题豁免，因为：
  #   · 表格单元格由列对齐决定，手动折行会破坏渲染；
  #   · 代码块折行会改变实际命令（复制粘贴即出错）；
  #   · 标题（尤其带徽章 <img> 的）折行会破坏锚点生成。
  MD013:
    line_length: 120
    tables: false
    code_blocks: false
    headings: false
  # MD033 禁止内联 HTML。
  # 标题里的 <img> 徽章是 GitHub README 的通行写法（shields.io / simpleicons），
  # 没有纯 Markdown 等价物；<details>/<summary> 用于折叠长内容，也属必要。
  # 因此按白名单放行这几个元素，其余 HTML 仍会被报错。
  MD033:
    allowed_elements: [img, br, details, summary, sub, sup, kbd]
  # MD041 要求文件首行是一级标题。
  # 两个 README 首行确实都是 H1，但该 H1 内嵌 <img> 徽章，
  # 部分版本的规则会把含 HTML 的首行误判为非标题，故关闭。
  MD041: false
  # MD028（引用块内空行）保持【开启】：它拦的是真实渲染问题——
  # 两个相邻 alert 若只用空行分隔，会被当成同一引用块内的空行。
  # 本仓库在两个 alert 之间插入 HTML 注释（注释不渲染）作为分隔，
  # 既有视觉断句又不产生多余内容；见根 README 的「固件更新与软件包恢复」一节。
